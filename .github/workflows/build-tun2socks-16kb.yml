name: Build libtun2socks.so (16 KB aligned)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "badvpn fork repo (owner/name). Must be the fork that supports --sock-path --fake-proc --dnsgw"
        default: "ambrop72/badvpn"
      ref:
        description: "branch / tag / commit"
        default: "master"
      api:
        description: "Android API level used for compiling (app minSdk = 21)"
        default: "21"
      android_mk:
        description: "Path to Android.mk inside the repo (leave empty = auto-detect, falls back to CMake)"
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      API: ${{ inputs.api }}
      ANDROID_MK: ${{ inputs.android_mk }}
    steps:
      - name: Checkout tun2socks source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: src
          submodules: recursive

      - name: Show source info
        run: |
          cd src
          git log -1 --format='commit %H %cd'
          ls
          echo "--- Android.mk files mentioning tun2socks"
          grep -rl "tun2socks" --include=Android.mk . || true
          echo "--- CMakeLists.txt at root?"
          ls CMakeLists.txt || true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build binutils

      - name: Build (ndk-build if Android.mk found, else CMake)
        shell: bash
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK"
          ROOT="$PWD"
          mkdir -p out/jniLibs
          cd src

          MK="$ANDROID_MK"
          if [ -z "$MK" ]; then
            MK="$(grep -rl "tun2socks" --include=Android.mk . | head -1 || true)"
          fi

          if [ -n "$MK" ] && [ -f "$MK" ]; then
            echo "=== ndk-build using $MK"
            "$NDK/ndk-build" \
              NDK_PROJECT_PATH="$PWD" \
              APP_BUILD_SCRIPT="$PWD/$MK" \
              APP_ABI="arm64-v8a armeabi-v7a" \
              APP_PLATFORM="android-$API" \
              APP_LDFLAGS="-Wl,-z,max-page-size=16384" \
              NDK_LIBS_OUT="$PWD/ndk_libs" \
              NDK_OUT="$PWD/ndk_obj" \
              -j"$(nproc)"
            for ABI in arm64-v8a armeabi-v7a; do
              F="$(find ndk_libs/$ABI -maxdepth 1 \( -name 'tun2socks' -o -name 'libtun2socks.so' \) | head -1)"
              if [ -z "$F" ]; then echo "tun2socks output not found for $ABI"; ls -R ndk_libs || true; exit 1; fi
              mkdir -p "$ROOT/out/jniLibs/$ABI"
              cp "$F" "$ROOT/out/jniLibs/$ABI/libtun2socks.so"
            done
          else
            echo "=== CMake build"
            for ABI in arm64-v8a armeabi-v7a; do
              cmake -S . -B "build-$ABI" -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$ABI" \
                -DANDROID_PLATFORM="android-$API" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="-fPIE" \
                -DCMAKE_EXE_LINKER_FLAGS="-pie -Wl,-z,max-page-size=16384" \
                -DBUILD_NOTHING_BY_DEFAULT=1 -DBUILD_TUN2SOCKS=1
              cmake --build "build-$ABI" -j"$(nproc)"
              F="$(find "build-$ABI" -type f -name tun2socks | head -1)"
              if [ -z "$F" ]; then echo "tun2socks output not found for $ABI"; exit 1; fi
              mkdir -p "$ROOT/out/jniLibs/$ABI"
              cp "$F" "$ROOT/out/jniLibs/$ABI/libtun2socks.so"
            done
          fi

          # strip debug symbols
          for ABI in arm64-v8a armeabi-v7a; do
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" "$ROOT/out/jniLibs/$ABI/libtun2socks.so" || true
          done

      - name: Verify (alignment + required options)
        shell: bash
        run: |
          set +e
          FAIL=0
          REPORT=out/verify.txt
          : > "$REPORT"
          for ABI in arm64-v8a armeabi-v7a; do
            F="out/jniLibs/$ABI/libtun2socks.so"
            echo "=== $ABI" | tee -a "$REPORT"
            ls -la "$F" | tee -a "$REPORT"
            echo "LOAD alignment:" | tee -a "$REPORT"
            readelf -lW "$F" | awk '/LOAD/{print $NF}' | sort -u | tee -a "$REPORT"
            if readelf -lW "$F" | awk '/LOAD/{print $NF}' | grep -qx "0x1000"; then
              echo "!! $ABI still has 4 KB alignment" | tee -a "$REPORT"; FAIL=1
            fi
            # options used by the app (V2RayVpnService.kt)
            for OPT in "--netif-ipaddr" "--netif-netmask" "--socks-server-addr" "--tunmtu" "--sock-path" "--enable-udprelay" "--netif-ip6addr" "--dnsgw" "--loglevel"; do
              if strings -a "$F" | grep -q -- "$OPT"; then
                echo "ok   $OPT" | tee -a "$REPORT"
              else
                echo "MISSING $OPT  (this source is NOT the fork the app needs)" | tee -a "$REPORT"; FAIL=1
              fi
            done
          done
          if [ "$FAIL" = "1" ]; then
            echo "VERIFY FAILED - see out/verify.txt"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tun2socks-16kb
          path: out/
